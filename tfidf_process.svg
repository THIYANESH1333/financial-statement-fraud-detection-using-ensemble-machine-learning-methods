<svg width="1200" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="40" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">TF-IDF Feature Extraction Process</text>
  
  <!-- Step 1: Raw Text -->
  <rect x="50" y="120" width="220" height="80" rx="10" fill="#2E86AB" stroke="white" stroke-width="2"/>
  <text x="160" y="155" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Raw Financial Text</text>
  <text x="160" y="175" font-size="11" text-anchor="middle" fill="white">MD&amp;A, notes, audit remarks</text>
  
  <!-- Step 2: Preprocessing -->
  <rect x="320" y="120" width="220" height="80" rx="10" fill="#6C757D" stroke="white" stroke-width="2"/>
  <text x="430" y="150" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Preprocessing</text>
  <text x="430" y="170" font-size="11" text-anchor="middle" fill="white">cleaning, lemmatize, keep ₹, %, FY</text>
  
  <!-- Step 3: Tokenization -->
  <rect x="590" y="120" width="220" height="80" rx="10" fill="#17A2B8" stroke="white" stroke-width="2"/>
  <text x="700" y="155" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Tokenization</text>
  <text x="700" y="175" font-size="11" text-anchor="middle" fill="white">words/tokens</text>
  
  <!-- Step 4: Term Frequency (TF) -->
  <rect x="860" y="120" width="280" height="80" rx="10" fill="#28A745" stroke="white" stroke-width="2"/>
  <text x="1000" y="145" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Term Frequency (TF)</text>
  <text x="1000" y="165" font-size="11" text-anchor="middle" fill="white">count(term) / total terms</text>
  
  <!-- Arrows Top Row -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
  </defs>
  <line x1="270" y1="160" x2="320" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="160" x2="590" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810" y1="160" x2="860" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Middle Row: Corpus and IDF -->
  <rect x="320" y="260" width="260" height="90" rx="10" fill="#FFC107" stroke="white" stroke-width="2"/>
  <text x="450" y="290" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Corpus</text>
  <text x="450" y="310" font-size="11" text-anchor="middle" fill="#333">All documents in dataset</text>
  
  <rect x="620" y="260" width="260" height="90" rx="10" fill="#FD7E14" stroke="white" stroke-width="2"/>
  <text x="750" y="290" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">Inverse Document Frequency (IDF)</text>
  <text x="750" y="310" font-size="11" text-anchor="middle" fill="#fff">log(N / df(term))</text>
  
  <line x1="450" y1="210" x2="450" y2="260" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="210" x2="750" y2="260" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Bottom Row: TF-IDF and Vector -->
  <rect x="320" y="400" width="300" height="90" rx="10" fill="#DC3545" stroke="white" stroke-width="2"/>
  <text x="470" y="430" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">TF-IDF Calculation</text>
  <text x="470" y="450" font-size="11" text-anchor="middle" fill="#fff">TF(term, doc) × IDF(term)</text>
  
  <rect x="680" y="400" width="420" height="90" rx="10" fill="#6610F2" stroke="white" stroke-width="2"/>
  <text x="890" y="430" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">Sparse Vector Representation</text>
  <text x="890" y="450" font-size="11" text-anchor="middle" fill="#fff">input to SVM / XGBoost / Logistic</text>
  
  <line x1="750" y1="350" x2="750" y2="400" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="445" x2="680" y2="445" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Notes -->
  <text x="600" y="560" font-size="12" text-anchor="middle" fill="#555">Pipeline: Raw Text → Preprocessing → Tokenization → TF → IDF → TF-IDF → Vector</text>
</svg>
